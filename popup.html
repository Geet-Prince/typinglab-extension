<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TypingLab</title>
  <style>
    :root {
      --bg: #111315;
      --card: #1a1d21;
      --border: #2b3036;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    html, body, div, span, textarea, select, button, label, input {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.RUNNING { color: var(--accent); border-color: rgba(16,185,129,0.4); }
    .badge.PAUSED { color: var(--warn); border-color: rgba(245,158,11,0.4); }
    .badge.ERROR, .badge.EXPIRED { color: var(--danger); border-color: rgba(239,68,68,0.4); }

    .timer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }
    .countdown {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .subtext { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .progress-bar {
      height: 5px;
      background: #262a30;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .metric-val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .config-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    textarea {
      width: 100%;
      height: 68px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    select, .file-label {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    input[type="file"] { display: none; }

    .controls { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-start { background: var(--accent); color: #052e16; }
    .btn-pause { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-stop { background: var(--danger); color: #fff; }
    .error-msg {
      color: var(--danger);
      font-size: 11px;
      margin-bottom: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">TypingLab</span>
    <span id="statusBadge" class="badge">IDLE</span>
  </div>

  <div class="timer-card">
    <div id="countdown" class="countdown">20:00</div>
    <div class="subtext">anti-bot simulated typing session</div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
  </div>

  <div class="metrics">
    <div class="metric-box">
      <div class="metric-label">1K Milestone</div>
      <div id="milestoneVal" class="metric-val">0 chars</div>
    </div>
    <div class="metric-box">
      <div class="metric-label">Processed</div>
      <div id="exactCharsVal" class="metric-val">0 / 0</div>
    </div>
  </div>

  <div id="errorBox" class="error-msg"></div>

  <div id="configSection" class="config-section">
    <textarea id="sourceText" placeholder="Paste text here, or load a .txt / .pdf... (Auto-saved)"></textarea>
    <div class="row">
      <label class="file-label">
        Load .TXT / .PDF
        <input type="file" id="fileInput" accept=".txt,.md,.pdf" />
      </label>
      <select id="durationSelect" title="Session Duration">
        <option value="5">5 Mins</option>
        <option value="10">10 Mins</option>
        <option value="15">15 Mins</option>
        <option value="20" selected>20 Mins (Max)</option>
      </select>
    </div>
    <div class="row">
      <select id="paceSelect" title="Typing Speed">
        <option value="steady">Steady (45 WPM)</option>
        <option value="natural" selected>Natural (65 WPM)</option>
        <option value="fast">Fast (90 WPM)</option>
      </select>
      <select id="bufferModeSelect" title="Input Box Behavior">
        <option value="rolling" selected>Rolling Box</option>
        <option value="append">Append</option>
      </select>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start">Start Bot Session</button>
    <button id="pauseBtn" class="btn-pause" style="display:none;">Pause</button>
    <button id="stopBtn" class="btn-stop" style="display:none;">Stop</button>
  </div>

  <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
    <button id="toggleLogsBtn" style="background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 5px 8px; font-size: 11px;">
      View Logs (0)
    </button>
    <button id="clearLogsBtn" style="background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 5px 8px; font-size: 11px; display: none;">
      Clear Logs
    </button>
  </div>

  <div id="logsDrawer" style="display: none; margin-top: 8px; max-height: 130px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-family: monospace; font-size: 11px;">
    <div id="logsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
